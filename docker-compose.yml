services:

  # Backend API
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: hustlehub-backend

    restart: unless-stopped

    env_file:
      - ./api/.env

    environment:
      NODE_ENV: production
      PORT: 3444
      HOST: 0.0.0.0
      HTTPS_ENABLED: "false"

    expose:
      - "3444"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3444/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Frontend application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: hustlehub-frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy