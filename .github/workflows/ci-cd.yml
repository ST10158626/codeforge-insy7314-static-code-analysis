name: HustleHub+ CI/CD Pipeline

# Automatically execute the pipeline when code is pushed
# or when a pull request is created or updated.
on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Backend and frontend jobs can execute independently.
jobs:

  # ==========================================
  # BACKEND JOB
  # ==========================================
  backend:
    name: Backend Tests and Build
    runs-on: ubuntu-latest

    steps:
      # Retrieve repository source code.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Configure Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: api/package-lock.json

      # Install backend dependencies.
      - name: Install backend dependencies
        working-directory: api
        run: npm ci

      # Execute backend automated tests.
      - name: Run backend tests
        working-directory: api
        env:
          JWT_SECRET: test-only-secret-for-hustlehub
        run: npm test

      # Validate backend JavaScript syntax.
      - name: Build backend
        working-directory: api
        run: npm run build

  # ==========================================
  # FRONTEND JOB
  # ==========================================
  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    steps:
      # Retrieve repository source code.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Configure Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install frontend dependencies.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Execute frontend automated tests.
      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      # Check frontend code quality.
      - name: Run frontend linting
        working-directory: frontend
        run: npm run lint

      # Build frontend application.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ==========================================
  # SONARQUBE
  # ==========================================
  sonarqube:
    name: SonarQube Static Code Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io